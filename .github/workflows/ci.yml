name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  preview:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy a Workers preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/friends-quiz/subdomain`
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "Cloudflare-Workers-Script-Api-Date": "2025-08-01",
          }
          const current = await fetch(url, { headers })
          const body = await current.json()
          const enabled = body?.result?.enabled === true
          const updated = await fetch(url, {
            method: "POST",
            headers,
            body: JSON.stringify({ enabled, previews_enabled: true }),
          })
          if (!updated.ok) {
            console.error(await updated.text())
            process.exit(1)
          }
          EOF
          npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json --message "Pull request #${{ github.event.pull_request.number }}" > preview.json
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs"
          const raw = readFileSync("preview.json", "utf8")
          const parsed = JSON.parse(raw.slice(raw.indexOf("{")))
          const urls = [...new Set([
            ...(parsed.preview_urls ?? []),
            ...(parsed.deployment_urls ?? []),
            ...(parsed.preview?.urls ?? []),
            ...(parsed.deployment?.urls ?? []),
          ].filter((url) => typeof url === "string"))]
          const summary = [
            "## Quiz preview",
            "",
            ...urls.map((url) => `- ${url}`),
            "",
            "Open `/host` on that address for the TV. The preview URL is public.",
            "",
          ].join("\n")
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          if (urls.length === 0) {
            console.error("Wrangler did not return a preview URL")
            console.error(JSON.stringify({
              keys: Object.keys(parsed),
              preview: parsed.preview ? Object.keys(parsed.preview) : null,
              deployment: parsed.deployment ? Object.keys(parsed.deployment) : null,
            }))
            process.exit(1)
          }
          console.log(urls.join("\n"))
          EOF
